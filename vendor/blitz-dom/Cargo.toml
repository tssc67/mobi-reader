[package]
name = "blitz-dom"
version = "0.3.0-beta.2"
description = "Blitz DOM implementation"
documentation = "https://docs.rs/blitz-dom"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = ["svg", "woff", "accessibility", "system-fonts", "file-input", "custom-widget"]
custom-widget = ["dep:anyrender", "accessibility"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "dep:svgtypes"]
woff = ["dep:wuff"]
accessibility = ["accesskit"]
system-fonts = ["parley/system"]
complex-scripts = ["parley/complex-scripts"]
autofocus = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
file-input = []
scrollbars = []
parallel-construct = []
log-phase-times = ["debug_timer/enable"]

[dependencies]
blitz-traits = { version = "=0.3.0-beta.2", git = "https://github.com/DioxusLabs/blitz", rev = "7931e6794d5d0e791660cc3474536047c01239ed", default-features = false }
stylo_taffy = { version = "=0.3.0-beta.2", git = "https://github.com/DioxusLabs/blitz", rev = "7931e6794d5d0e791660cc3474536047c01239ed", default-features = false, features = ["default"] }
debug_timer = { version = "0.1.2", git = "https://github.com/DioxusLabs/blitz", rev = "7931e6794d5d0e791660cc3474536047c01239ed" }
style = { version = "0.21.0", package = "stylo" }
style_traits = { version = "0.21.0", package = "stylo_traits" }
style_config = { version = "0.21.0", package = "stylo_static_prefs" }
style_dom = { version = "0.21.0", package = "stylo_dom" }
selectors = "0.40.0"
cssparser = "0.37.0"
markup5ever = "0.39.0"
euclid = "0.22"
atomic_refcell = "0.1.13"
app_units = "0.7.5"
smallvec = "1"
thin-vec = "0.2"
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4863877b9cab21645b160d7f247901f90214fe27", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
anyrender = { version = "0.13.0", optional = true }
accesskit = { version = "0.25", optional = true }
parley = { git = "https://github.com/linebender/parley", rev = "6a9444f402b2c8698cf0c28dcd7ea8b469688f16", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
linebender_resource_handle = "0.1"
color = "0.3"
kurbo = "0.13.1"
slotmap = "1.0.7"
bitflags = "2.8.0"
tracing = { version = "0.1.40", optional = true }
rayon = "1"
image = { version = "0.25.6", default-features = false }
usvg = { version = "0.48.1", optional = true }
svgtypes = { version = "0.16.1", optional = true }
wuff = { version = "0.2", optional = true }
html-escape = "0.2.13"
percent-encoding = "2.3.1"
url = "2.5.0"
keyboard-types = "0.7"
cursor-icon = "1"
thread_local = "1"
web-time = "1"

[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
